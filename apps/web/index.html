<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花火工作室 · 个人知识宇宙 MVP</title>
<style>
  :root { --ink:#2d3436; --paper:#faf9f7; --accent:#e17055; --calm:#00b894; --warn:#fdcb6e; --line:#ddd; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"PingFang SC","Noto Sans CJK SC",sans-serif; background:var(--paper); color:var(--ink); line-height:1.6; }
  header { background:var(--ink); color:#fff; padding:18px 24px; }
  header h1 { font-size:20px; font-weight:600; }
  header p { font-size:13px; opacity:.75; margin-top:2px; }
  main { max-width:960px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  .card h2 { font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  textarea { width:100%; min-height:120px; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:14px; font-family:inherit; resize:vertical; }
  input[type=text] { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:14px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 20px; font-size:14px; cursor:pointer; }
  button:hover { opacity:.9; }
  button.secondary { background:#636e72; }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .tag { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; }
  .tag.conflicted { background:#ffe0dc; color:#c0392b; }
  .tag.superseded { background:#e8f8f5; color:#148f77; }
  .tag.rejected { background:#f0f0f0; color:#636e72; }
  .tag.live { background:#fef9e7; color:#b7950b; }
  .entry { border-left:3px solid var(--line); padding:8px 12px; margin:8px 0; background:#fbfbfb; border-radius:0 6px 6px 0; }
  .entry .meta { font-size:12px; color:#777; margin-bottom:4px; }
  .arbitrate { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .arbitrate button { font-size:12px; padding:6px 12px; }
  .arbitrate .keepA { background:#00b894; }
  .arbitrate .keepB { background:#e17055; }
  .arbitrate .split { background:#6c5ce7; }
  .arbitrate .redefine { background:#636e72; }
  .rule { background:#f0f8ff; border-left:3px solid #0984e3; padding:6px 10px; font-size:12px; color:#555; margin-top:4px; }
  #status { font-size:12px; color:#777; margin-top:8px; }
  .map-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:12px 0; }
  .map-cell { text-align:center; padding:14px; border-radius:8px; }
  .map-cell .num { font-size:26px; font-weight:700; }
  .map-cell .label { font-size:12px; color:#777; margin-top:4px; }
  .timeline { border-left:2px solid var(--line); padding-left:16px; }
  .timeline .item { margin:10px 0; position:relative; }
  .timeline .item::before { content:""; position:absolute; left:-21px; top:6px; width:10px; height:10px; border-radius:50%; background:var(--accent); }
  .timeline .time { font-size:12px; color:#777; }
  .timeline .choice { font-weight:600; }
  @media (max-width:640px){ .map-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>🌸 个人知识宇宙</h1>
  <p>花火工作室 MVP v0.1 —— 知识打架的时候，你才是裁判</p>
</header>
<main>

  <!-- 导入 -->
  <div class="card">
    <h2>📥 导入资料</h2>
    <textarea id="importText" placeholder="粘贴你要整理的知识/笔记/资料……&#10;每一行会成为一个知识条目（claim）"></textarea>
    <div class="row">
      <input type="text" id="importTitle" placeholder="标题（可选）" style="flex:1">
      <button onclick="doImport()">导入</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- 冲突 -->
  <div class="card">
    <h2>⚡ 冲突检测 <span id="conflictCount" class="tag" style="margin-left:auto">—</span></h2>
    <div id="conflictList"></div>
    <p class="rule">纪律：digest 命中 ≠ 语义通过 —— 冲突判定走三维规则（lineage → digest → validity），边界模糊升格 conflicted 交给你仲裁。</p>
  </div>

  <!-- 知识地图 -->
  <div class="card">
    <h2>🗺️ 我的知识地图</h2>
    <div class="map-grid">
      <div class="map-cell" style="background:#e8f8f5"><div class="num" id="mTotal">0</div><div class="label">知识条目</div></div>
      <div class="map-cell" style="background:#ffe0dc"><div class="num" id="mConflict">0</div><div class="label">冲突中</div></div>
      <div class="map-cell" style="background:#fef9e7"><div class="num" id="mRulings">0</div><div class="label">年轮记录</div></div>
    </div>
    <div id="recentEntries"></div>
  </div>

  <!-- 年轮 -->
  <div class="card">
    <h2>🌳 年轮（裁定记录 · 只追加不划掉）</h2>
    <div class="timeline" id="rulingList"></div>
  </div>

</main>
<script>
const API = "";
let lastConflicts = [];

function setStatus(msg){ document.getElementById("status").textContent = msg; }

async function doImport(){
  const text = document.getElementById("importText").value.trim();
  if(!text){ setStatus("请先输入内容"); return; }
  setStatus("导入中……");
  try {
    const r = await fetch(API+"/api/import", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text, title: document.getElementById("importTitle").value})});
    const j = await r.json();
    setStatus(`✅ 已导入 ${j.imported} 条知识条目${j.detector ? "（冲突检测器在线）" : "（检测器未加载，使用简化判定）"}`);
    refresh();
  } catch(e){ setStatus("❌ 导入失败："+e.message); }
}

async function refresh(){
  await Promise.all([loadConflicts(), loadMap(), loadRulings()]);
}

async function loadConflicts(){
  try {
    const r = await fetch(API+"/api/conflicts"); const j = await r.json();
    lastConflicts = j.conflicts;
    const box = document.getElementById("conflictList");
    box.innerHTML = "";
    document.getElementById("conflictCount").textContent = j.count ? j.count+" 处冲突" : "无冲突";
    document.getElementById("conflictCount").className = "tag "+(j.count?"conflicted":"live");
    j.conflicts.forEach(c => {
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = `<div class="meta">claim: ${c.claim_id.slice(0,18)}… · <span class="tag conflicted">CONFLICTED</span></div>`
        + c.entries.map(e=>`<div>${escapeHtml(e.content)}</div>`).join("")
        + `<div class="arbitrate">
             <button class="keepA" onclick="arbitrate('${c.claim_id}','KEEP_A')">保留 A</button>
             <button class="keepB" onclick="arbitrate('${c.claim_id}','KEEP_B')">保留 B</button>
             <button class="split"  onclick="arbitrate('${c.claim_id}','SPLIT')">拆分</button>
             <button class="redefine" onclick="arbitrate('${c.claim_id}','REDEFINE')">重定义</button>
           </div>`;
      box.appendChild(div);
    });
  } catch(e){}
}

async function arbitrate(claimId, choice){
  try {
    await fetch(API+"/api/arbitrate", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({claim_id: claimId, choice, note:""})});
    setStatus(`✅ 已裁定 ${choice} —— 年轮已追加`);
    refresh();
  } catch(e){ setStatus("❌ 裁定失败："+e.message); }
}

async function loadMap(){
  try {
    const r = await fetch(API+"/api/knowledge-map"); const j = await r.json();
    document.getElementById("mTotal").textContent = j.total;
    document.getElementById("mConflict").textContent = lastConflicts.length;
    document.getElementById("mRulings").textContent = (await (await fetch(API+"/api/rulings")).json()).count || 0;
    const box = document.getElementById("recentEntries"); box.innerHTML = "";
    (j.recent||[]).forEach(e=>{
      const d = document.createElement("div"); d.className="entry";
      d.innerHTML = `<div class="meta">${escapeHtml(e.claim_id.slice(0,16))}… · <span class="tag ${e.source_role}">${e.source_role}</span></div><div>${escapeHtml(e.content)}</div>`;
      box.appendChild(d);
    });
  } catch(e){}
}

async function loadRulings(){
  try {
    const r = await fetch(API+"/api/rulings"); const j = await r.json();
    const box = document.getElementById("rulingList"); box.innerHTML = "";
    if(!j.count){ box.innerHTML = `<p style="color:#aaa">还没有裁定记录——第一次冲突仲裁会在这里长出一圈年轮。</p>`; return; }
    [...j.rulings].reverse().forEach(ru=>{
      const d = document.createElement("div"); d.className="item";
      d.innerHTML = `<div class="time">${escapeHtml(ru.created_at)}</div>
        <div>claim <code>${escapeHtml(ru.claim_id.slice(0,18))}…</code> · <span class="choice">${ru.choice}</span></div>
        ${ru.note?`<div style="font-size:12px;color:#777">${escapeHtml(ru.note)}</div>`:""}`;
      box.appendChild(d);
    });
  } catch(e){}
}

function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

refresh();
</script>
</body>
</html>
