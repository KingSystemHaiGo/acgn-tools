<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识宇宙 · 花火工作室 MVP</title>
<style>
  :root {
    --ink: #2d2a26;
    --paper: #faf7f2;
    --paper2: #f1ece3;
    --accent: #b5651d;
    --ok: #3e7d4f;
    --warn: #b5651d;
    --conflict: #a03a2e;
    --line: #ddd5c8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--paper); color: var(--ink);
    max-width: 860px; margin: 0 auto; padding: 24px 16px 80px;
    line-height: 1.6;
  }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; letter-spacing: 1px; }
  .sub { color: #777; font-size: 13px; margin-top: 4px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--paper2); }
  .badge.ok { background: #e3efe6; color: var(--ok); }
  .badge.conflict { background: #f6e3e0; color: var(--conflict); }
  textarea, input[type=text] {
    width: 100%; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; font-size: 14px; font-family: inherit; background: #fff;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    background: var(--ink); color: var(--paper); border: none; border-radius: 6px;
    padding: 8px 18px; font-size: 14px; cursor: pointer; margin-top: 8px;
  }
  button:hover { background: #000; }
  button.small { padding: 4px 12px; font-size: 12px; margin-top: 0; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .entry { border-left: 3px solid var(--line); padding: 8px 10px; margin: 8px 0; background: var(--paper); border-radius: 0 6px 6px 0; }
  .entry .meta { font-size: 11px; color: #999; margin-top: 4px; }
  .entry.conflicted { border-left-color: var(--conflict); background: #fdf6f5; }
  .evidence { font-size: 12px; color: var(--conflict); margin-top: 6px; }
  .verdict-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .verdict-row button {
    background: #fff; color: var(--ink); border: 1px solid var(--line);
    font-size: 12px; padding: 4px 10px; margin-top: 0;
  }
  .verdict-row button:hover { border-color: var(--ink); background: var(--paper2); }
  .verdict-row button.done { background: var(--ok); color: #fff; border-color: var(--ok); }
  .empty { color: #999; font-size: 13px; padding: 12px 0; }
  .stat-grid { display: flex; gap: 12px; margin: 8px 0; }
  .stat { flex: 1; text-align: center; background: var(--paper2); border-radius: 6px; padding: 10px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: #777; }
  .ring { border-left: 2px solid var(--line); padding-left: 14px; margin: 6px 0; }
  .ring .t { font-size: 12px; color: #999; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 10px 20px;
    border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  code { background: var(--paper2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🌌 个人知识宇宙</h1>
  <div class="sub">花火工作室 MVP v0.1 —— 导入资料 → 知识条目 → 冲突检测 → 你仲裁 → 年轮追加</div>
</header>

<div class="card">
  <h2>📥 导入一段资料 <span class="badge" id="detector-badge">检测器: 载入中</span></h2>
  <input type="text" id="title" placeholder="标题（可选，同标题的多行内容会被归为同一个主题）">
  <textarea id="text" placeholder="粘贴/写下你的资料，每行一个断言。例：&#10;太阳从东边升起&#10;太阳从西边升起"></textarea>
  <button onclick="doImport()">导入 →</button>
</div>

<div class="card">
  <h2>⚡ 冲突检测 <span class="badge" id="conflict-count">0</span></h2>
  <div id="conflicts"><div class="empty">暂无冲突。导入资料后，同一主题下互相矛盾的断言会在这里摊开给你看。</div></div>
</div>

<div class="card">
  <h2>🗺️ 知识地图 <span class="badge">三态分布</span></h2>
  <div class="stat-grid">
    <div class="stat"><b id="s-nascent">0</b><span>纳入（我验证过的）</span></div>
    <div class="stat"><b id="s-shelved">0</b><span>搁置（存疑待考）</span></div>
    <div class="stat"><b id="s-seeking">0</b><span>求索（想搞清楚的）</span></div>
  </div>
  <div id="map-entries"></div>
</div>

<div class="card">
  <h2>🌳 年轮 <span class="badge">append-only</span></h2>
  <div id="rulings"><div class="empty">还没有仲裁记录。每一次仲裁都会长成一道年轮。</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let detectorOK = false;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function doImport() {
  const text = $('text').value.trim();
  if (!text) return toast('内容为空');
  const title = $('title').value.trim() || null;
  try {
    const res = await api('/api/import', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, title}),
    });
    toast(`导入 ${res.imported} 条，主题 ${res.claim_id}${res.detector ? '（完整检测器）' : '（简化检测）'}`);
    $('text').value = '';
    refreshAll();
  } catch (e) { toast('导入失败: ' + e.message); }
}

async function arbitrate(claimId, choice, note) {
  try {
    await api('/api/arbitrate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({claim_id: claimId, choice, note: note || ''}),
    });
    toast(`已仲裁：${choice}`);
    refreshAll();
  } catch (e) { toast('仲裁失败: ' + e.message); }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function refreshConflicts() {
  const data = await api('/api/conflicts');
  $('conflict-count').textContent = data.count;
  const box = $('conflicts');
  if (!data.count) {
    box.innerHTML = '<div class="empty">暂无冲突。导入资料后，同一主题下互相矛盾的断言会在这里摊开给你看。</div>';
    return;
  }
  box.innerHTML = data.conflicts.map(c => {
    const entries = c.entries.map(e => `
      <div class="entry conflicted">
        <div>${esc(e.content)}</div>
        <div class="meta">${esc(e.entry_id)} · rev ${esc(e.revision)} · ${esc(e.source_role)}</div>
      </div>`).join('');
    const ev = (c.evidence || []).map(x => `证据: ${esc(x.field)} — ${esc((x.values||[]).join(' vs '))}`).join('');
    return `
      <div class="card" style="margin-bottom:10px">
        <b>主题 ${esc(c.claim_id)}</b> <span class="badge conflict">${esc(c.verdict)}</span>
        ${entries}
        ${ev ? `<div class="evidence">${ev}</div>` : ''}
        <div class="verdict-row">
          <button onclick="arbitrate('${esc(c.claim_id)}','KEEP_A')">留 A</button>
          <button onclick="arbitrate('${esc(c.claim_id)}','KEEP_B')">留 B</button>
          <button onclick="arbitrate('${esc(c.claim_id)}','SPLIT')">拆分</button>
          <button onclick="arbitrate('${esc(c.claim_id)}','REDEFINE')">重新定义</button>
        </div>
      </div>`;
  }).join('');
}

async function refreshMap() {
  const data = await api('/api/knowledge-map');
  $('s-nascent').textContent = data.by_role.nascent;
  $('s-shelved').textContent = data.by_role.shelved;
  $('s-seeking').textContent = data.by_role.seeking;
  const box = $('map-entries');
  if (!data.entries.length) { box.innerHTML = '<div class="empty">宇宙还空着，先导入第一条知识吧。</div>'; return; }
  box.innerHTML = data.entries.slice(0, 12).map(e => {
    const st = e.tri_state || '';
    const stLabel = {nascent:'纳入', shelved:'搁置', seeking:'求索'}[st] || (st ? st : '未标记');
    return `<div class="entry"><div>${esc(e.content)}</div>
    <div class="meta">${esc(e.claim_id)} · 手动标记: ${stLabel}
      <span class="verdict-row" style="display:inline-flex;margin-left:8px">
        <button onclick="markEntry('${esc(e.entry_id)}','nascent')" ${st==='nascent'?'class="done"':''}>纳入</button>
        <button onclick="markEntry('${esc(e.entry_id)}','shelved')" ${st==='shelved'?'class="done"':''}>搁置</button>
        <button onclick="markEntry('${esc(e.entry_id)}','seeking')" ${st==='seeking'?'class="done"':''}>求索</button>
      </span>
    </div></div>`;
  }).join('');
}

async function markEntry(entryId, state) {
  try {
    await api('/api/mark', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({entry_id: entryId, state}),
    });
    toast(`已标记：${state}`);
    refreshAll();
  } catch (e) { toast('标记失败: ' + e.message); }
}

async function refreshRulings() {
  const data = await api('/api/rulings');
  const box = $('rulings');
  if (!data.count) return;
  box.innerHTML = data.rulings.map(r => `
    <div class="ring">
      <div><b>${esc(r.claim_id)}</b> → ${esc(r.choice)}</div>
      ${r.note ? `<div>${esc(r.note)}</div>` : ''}
      <div class="t">${esc(r.created_at)}</div>
    </div>`).join('');
}

async function refreshAll() {
  try {
    await Promise.all([refreshConflicts(), refreshMap(), refreshRulings()]);
  } catch (e) { toast('刷新失败: ' + e.message); }
}

(async () => {
  try {
    const h = await api('/api/health');
    detectorOK = h.detector;
    $('detector-badge').textContent = h.detector ? '完整检测器 ✓' : '简化检测（后端未挂载冲突检测器）';
    $('detector-badge').className = 'badge ' + (h.detector ? 'ok' : 'conflict');
  } catch (e) {
    $('detector-badge').textContent = '后端不可达: ' + e.message;
  }
  refreshAll();
})();
</script>
</body>
</html>
